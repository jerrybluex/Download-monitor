[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "download-monitor"
version = "0.1.0"
description = "A smart command-line download monitoring tool"
readme = "README.md"
authors = [
    {name = "jerrybluex", email = ""}
]
license = {text = "MIT"}
keywords = ["download", "monitor", "cli", "progress", "web-dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pytest>=7.4.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/jerrybluex/Download-monitor"
Repository = "https://github.com/jerrybluex/Download-monitor.git"
Issues = "https://github.com/jerrybluex/Download-monitor/issues"

[project.scripts]
download-monitor = "tools.download_monitor:main"
download-monitor-web = "tools.download_monitor_web:main"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]